    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!-- Standalone share card. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="clinamen" />
    <meta
      property="og:description"
      content="Porcelain bowls drifting on water, sounding microtonal tones as they meet — a tribute to Céleste Boursier-Mougenot."
    />
    <meta property="og:url" content="https://kevinpfab.com/clinamen/" />

    />

      name="twitter:description"
      content="Porcelain bowls drifting on water, sounding microtonal tones as they meet — a tribute to Céleste Boursier-Mougenot."

  <body>
    <div id="app"></div>
    <p class="basin-attribution">
      a tribute to "clinamen" by Céleste Boursier-Mougenot

    <div id="basin-fallback" class="basin-fallback" hidden>
      <p>This piece needs a browser with WebGL support enabled.</p>
    </div>
    <noscript>
      <div class="basin-fallback basin-fallback--noscript">
        <p>“clinamen” is an interactive piece that runs on JavaScript. Enable it, or open this page in a modern browser.</p>
